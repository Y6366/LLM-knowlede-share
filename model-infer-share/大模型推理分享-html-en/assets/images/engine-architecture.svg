<text x="1251.5" y="83.2" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="bold" fill="#004F99" text-anchor="middle">Request complete?</text>
<text x="1337.0" y="447.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">End request</text>
<text x="1337.0" y="472.7" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">release its KV Block references</text>

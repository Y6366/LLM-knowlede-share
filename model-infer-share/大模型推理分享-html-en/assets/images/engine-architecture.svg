<text x="495.5" y="707.3" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="bold" fill="#004F99" text-anchor="middle">Tokenization</text>
<text x="945.0" y="705.4" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">New requests keep arriving</text>
<text x="1336.0" y="684.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#004F99" text-anchor="middle">Freed capacity available for later scheduling</text>
<text x="838.5" y="1017.8" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#004F99" text-anchor="middle">Request queue</text>
<text x="838.5" y="1042.2" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="bold" fill="#004F99" text-anchor="middle">requests waiting or resuming execution</text>
<text x="914.0" y="1210.2" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">Scheduler: continuous batching</text>
<text x="914.0" y="1235.8" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">based on Token budget, KV capacity,</text>
<text x="914.0" y="1261.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">and request state</text>
<text x="914.0" y="1428.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">KV Cache Manager</text>
<text x="914.0" y="1454.2" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">paged Block allocation and reuse</text>
<text x="914.0" y="1672.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">Current iteration's</text>
<text x="914.0" y="1697.7" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">compute stage</text>
<text x="729.0" y="1850.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#004F99" text-anchor="middle">Input not fully processed</text>
<text x="966.0" y="1850.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17" font-weight="bold" fill="#004F99" text-anchor="middle">Continue generating</text>
<text x="471.0" y="2092.2" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">Prefill</text>
<text x="471.0" y="2117.8" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">process the input context,</text>
<text x="471.0" y="2143.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">build the KV Cache</text>
<text x="966.0" y="2092.2" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">Decode</text>
<text x="966.0" y="2117.8" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">reuse historical KV Cache</text>
<text x="966.0" y="2143.5" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">compute the new Token</text>
<text x="533.5" y="2310.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">Sampling</text>
<text x="533.5" y="2335.7" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="bold" fill="#004F99" text-anchor="middle">select the next Token</text>
<text x="463.5" y="2559.6" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="bold" fill="#004F99" text-anchor="middle">Output processing</text>
<text x="463.5" y="2582.7" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="bold" fill="#004F99" text-anchor="middle">detokenization and stop-condition checks</text>
<text x="463.5" y="2769.8" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#004F99" text-anchor="middle">API Server</text>
<text x="463.5" y="2791.8" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="bold" fill="#004F99" text-anchor="middle">stream back newly generated content</text>
<text x="1336.0" y="286.6" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="bold" fill="#004F99" text-anchor="middle">Yes</text>
